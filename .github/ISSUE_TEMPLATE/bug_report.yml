name: Bug report
description: Report a problem with Grab
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can it be reproduced?
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Grab version
      placeholder: e.g. 5.0.1
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux (Flatpak)
        - Linux (tarball)
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output, if any
      render: shell
