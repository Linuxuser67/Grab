name: CI

# Scoped so one push does one run: PR branches report via
# pull_request only (push-all would duplicate every PR run);
# main still verifies merges, tags and direct pushes.
on:
  push:
    branches: [main]
  pull_request:

# Rapid pushes supersede each other: cancel stale PR runs so only the
# latest push burns CI minutes. Main pushes and releases never cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Style-only signal in ~1 minute, no system deps: rustfmt needs
  # neither the Fedora container nor the GTK stack.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --check
  check:
    runs-on: ubuntu-latest
    # ubuntu-latest ships GTK 4.14 / libadwaita 1.4, but the gtk4 (v4_18)
    # and libadwaita (v1_8) crate features need system libs >= 4.18 / 1.8,
    # so run inside Fedora instead of on the host runner.
    container: fedora:44
    steps:
      - name: Install system dependencies
        run: dnf install -y git gcc pkg-config gtk4-devel libadwaita-devel python3
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      # Serial: the suite shares one glib default MainContext across test
      # threads, and glib futures are bound to their spawning thread, so
      # parallel runs abort when one test's loop polls another's source.
      - run: cargo test -- --test-threads=1
  # Guards the module structure: sentrux enforces the architectural rules
  # in .sentrux/rules.toml (currently: zero import cycles). Pinned to
  # v0.5.7 so an upstream release can't silently change the verdict; runs
  # in Fedora like the check job because the binary links libgtk-3.
  structure:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install system dependencies
        run: dnf install -y curl gtk3
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install sentrux
        run: |
          curl -sSL --fail https://github.com/sentrux/sentrux/releases/download/v0.5.7/sentrux-linux-x86_64 -o /usr/local/bin/sentrux
          chmod +x /usr/local/bin/sentrux
      - run: sentrux check
  # Guards the offline Flatpak build: a Cargo.lock stale against
  # Cargo.toml heals silently wherever cargo has network (local builds,
  # the tarball job) but is fatal under --offline, and an unregenerated
  # cargo-sources.json leaves the vendor dir short — the exact way
  # v4.0.0-beta.4 shipped without its bundle. Seconds, no system deps.
  vendor-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # --locked fails when the lock would need re-resolution; read-only otherwise.
      - run: cargo metadata --locked --format-version 1 >/dev/null
      - run: ./build-aux/gen-cargo-sources.py --check
  # Read-only secret and supply-chain scanning: gitleaks over the full
  # history plus cargo-audit against the RustSec advisory DB. No system
  # deps, no behavior risk — fails only when a secret or a
  # known-vulnerable dependency actually lands. Binaries are pinned like
  # sentrux above so an upstream release can't silently change the verdict.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # gitleaks scans history; the default shallow checkout would
          # hide every commit but the last.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL --fail https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
      - run: gitleaks detect --source . -v
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install cargo-audit
        run: |
          curl -sSL --fail https://github.com/RustSec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz -o /tmp/cargo-audit.tgz
          tar -xzf /tmp/cargo-audit.tgz -C /tmp
          install -m 755 /tmp/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit /usr/local/bin/cargo-audit
      - run: cargo audit
