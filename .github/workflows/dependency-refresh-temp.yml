name: Temporary stable dependency refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/stable-dependency-refresh-20261029'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Update Cargo dependencies within the declared Rust MSRV
        run: |
          sed -i 's/zip = { version = "9.1.2"/zip = { version = "9.1.3"/' Cargo.toml
          sed -i 's/rustix = { version = "1.1.5"/rustix = { version = "1.1.6"/' Cargo.toml
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo update
      - name: Validate lockfile and regenerate offline Flatpak sources
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          python3 build-aux/gen-cargo-sources.py
          git diff --check
      - name: Commit refreshed dependency files
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock build-aux/cargo-sources.json
          if git diff --cached --quiet; then
            echo "No dependency updates were selected by Cargo."
            exit 0
          fi
          git commit -m "chore(deps): refresh stable Cargo dependencies"
          git push origin "HEAD:${BRANCH}"
