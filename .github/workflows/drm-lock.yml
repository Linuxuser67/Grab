name: Temporary DRM dependency lock generation

on:
  push:
    branches:
      - feat/dash-license-acquisition

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - run: cargo generate-lockfile
      - run: python3 build-aux/gen-cargo-sources.py
      - name: Commit resolved lock and vendor source manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock build-aux/cargo-sources.json
          if git diff --cached --quiet; then
            echo "Dependency metadata already current"
            exit 0
          fi
          git commit -m "build(deps): resolve DRM CDM dependency graph"
          git push origin "HEAD:${GITHUB_REF_NAME}"
