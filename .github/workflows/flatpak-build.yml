name: Flatpak build

# Shared build chain for release bundles and PR test bundles. Every build
# is pristine (--force-clean, no SDK cache): validation must never depend
# on what a previous run left behind. Release mode attaches the bundle to
# the release; test mode uploads it as a workflow artifact instead.
on:
  workflow_call:
    inputs:
      ref:
        description: "Ref to check out"
        required: true
        type: string
      force-clean:
        description: "Pristine build directory"
        default: true
        type: boolean
      release-tag:
        description: "Attach the bundle here; empty uploads an artifact instead"
        default: ""
        type: string

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # Release mode: the tag's metadata (version, metainfo release,
      # HEAD) must agree before anything is built and published.
      - name: Check release metadata consistency
        if: inputs.release-tag != ''
        env:
          TAG: ${{ inputs.release-tag }}
        run: ./build-aux/check-release-consistency.py --tag "$TAG"

      # The GNOME SDK/Platform are immutable per runtime version and
      # would otherwise re-download (~1 min + GBs) on every pristine
      # build. Only this layer is cached; the build itself stays
      # --force-clean. `flatpak install` below stays as-is: on a cache
      # hit it is a fast no-op (or small delta refresh).
      - name: Cache GNOME SDK and Platform
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/flatpak
            ~/.cache/flatpak
          key: flatpak-sdk-${{ runner.os }}-${{ hashFiles('build-aux/io.github.linuxuser67.Grab.json') }}
          restore-keys: |
            flatpak-sdk-${{ runner.os }}-

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder python3

      - name: Install GNOME SDK and Platform
        run: |
          RUNTIME=$(python3 -c "import json; print(json.load(open('build-aux/io.github.linuxuser67.Grab.json'))['runtime-version'])")
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub "org.gnome.Platform//$RUNTIME" "org.gnome.Sdk//$RUNTIME"

      - name: Regenerate vendored cargo sources
        run: python3 build-aux/gen-cargo-sources.py

      # --user: the flathub remote above is user-scoped, so dependency
      # resolution must run in user scope too (system scope can't see it).
      - name: Flatpak build
        run: >
          flatpak-builder ${{ inputs.force-clean && '--force-clean' || '' }} --user
          --repo=flatpak-repo --install-deps-from=flathub build
          build-aux/io.github.linuxuser67.Grab.json

      # Read back what the repo actually embeds before packing it: the
      # installed metainfo's newest release must match the tag, or a tag
      # published before the metainfo was updated ships stale release
      # notes with no visible sign. The .flatpak file itself is an opaque
      # ostree GVariant (not a tarball), so the repo -- exactly what
      # build-bundle packs -- is inspected with the ostree CLI. Test-mode
      # bundles have no tag, so the version is read from Cargo.toml.
      - name: Check bundle contents
        env:
          TAG: ${{ inputs.release-tag }}
        run: |
          if [ -n "$TAG" ]; then
            ./build-aux/check-bundle-contents.py --repo flatpak-repo --tag "$TAG"
          else
            ./build-aux/check-bundle-contents.py --repo flatpak-repo --tag "v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          fi

      - name: Bundle
        run: flatpak build-bundle flatpak-repo Grab.flatpak io.github.linuxuser67.Grab

      - name: Attach to the release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: |
          ls -lh Grab.flatpak
          gh release upload "$TAG" Grab.flatpak --clobber

      - name: Upload test bundle
        if: inputs.release-tag == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Grab.flatpak
          path: Grab.flatpak
          retention-days: 14
