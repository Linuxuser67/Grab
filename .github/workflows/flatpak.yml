name: Flatpak bundle

# Clean release builds happen here, not on maintainer machines. Publishing
# a GitHub release (or manually dispatching with a tag) builds the bundle
# from that tag in a pristine container and attaches Grab.flatpak back to
# the release. No local bundle step remains in the release process.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build the bundle for"
        required: true

jobs:
  bundle:
    permissions:
      contents: read
    uses: ./.github/workflows/flatpak-build.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
      force-clean: true
      release-tag: ${{ github.event.release.tag_name || inputs.tag }}

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release upload resolves the base repo from git; without a checkout
      # the publish step fails with "not a git repository" (seen on beta.23).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the validated Flatpak bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Grab.flatpak
          path: dist

      - name: Attach bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/Grab.flatpak --clobber
