name: One-time dependency refresh

on:
  push:
    branches:
      - chore/deps-release-6.5.4

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.0
      - name: Refresh Rust dependencies with the declared MSRV
        run: cargo update
      - name: Regenerate offline Flatpak crate sources
        run: python3 build-aux/gen-cargo-sources.py
      - name: Validate the locked dependency graph and release metadata
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          ./build-aux/check-release-consistency.py
          git diff --check
      - name: Commit the generated dependency state
        run: |
          if git diff --quiet; then
            echo "No dependency lockfile or vendor changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock build-aux/cargo-sources.json
          git commit -m "chore(deps): refresh locked crates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
