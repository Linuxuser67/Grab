name: Refresh release lockfile

on:
  push:
    branches: [release/6.5.3]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Regenerate Cargo.lock from the updated package manifest
        run: cargo metadata --format-version 1 >/dev/null
      - name: Commit the Cargo-generated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches Cargo.toml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(release): regenerate Cargo.lock for 6.5.3"
          git push
