name: Regenerate Cargo vendor manifest (temporary)

on:
  push:
    branches:
      - tmp/regenerate-cargo-sources

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Regenerate and verify the offline vendor manifest
        run: |
          python3 build-aux/gen-cargo-sources.py
          python3 build-aux/gen-cargo-sources.py --check
          git diff --check

      - name: Commit generated manifest and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/regenerate-cargo-sources-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- build-aux/cargo-sources.json .github/workflows/regenerate-cargo-sources-once.yml
          git diff --cached --check
          git commit -m "chore(flatpak): regenerate cargo vendor manifest"
          git push origin HEAD
