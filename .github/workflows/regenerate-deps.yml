name: Regenerate dependency lock

on:
  push:
    branches:
      - deps/stable-updates

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Update all semver-compatible dependencies
        run: cargo update
      - name: Regenerate offline Flatpak source manifest
        run: python3 build-aux/gen-cargo-sources.py
      - name: Validate lockfile and generated manifest
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          ./build-aux/gen-cargo-sources.py --check
          git diff --check
      - name: Commit dependency updates
        run: |
          if git diff --quiet -- Cargo.lock build-aux/cargo-sources.json; then
            echo "No compatible dependency updates are available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock build-aux/cargo-sources.json
          git commit -m "chore(deps): update compatible stable dependencies"
          git push origin HEAD:refs/heads/deps/stable-updates
