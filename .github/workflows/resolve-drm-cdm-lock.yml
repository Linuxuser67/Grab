name: Resolve DRM CDM lockfile

on:
  pull_request:
    paths:
      - Cargo.toml
      - .github/workflows/resolve-drm-cdm-lock.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh the PlayReady AES dependency to a non-yanked release
        run: cargo update -p aes@0.9.0
      - name: Resolve the new CDM dependency graph
        run: cargo metadata --format-version 1 >/dev/null
      - name: Regenerate the Flatpak vendor source manifest
        run: python3 build-aux/gen-cargo-sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-drm-cdm-lock
          path: |
            Cargo.lock
            build-aux/cargo-sources.json
          if-no-files-found: error
          retention-days: 1
      - name: Commit generated dependency files to the staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock build-aux/cargo-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "build(drm): lock CDM dependency graph"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
