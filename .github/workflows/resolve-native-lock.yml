name: Resolve PR lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Resolve the manifest against the existing lockfile
        run: cargo metadata --format-version 1 >/dev/null
      - name: Regenerate the offline Flatpak source manifest
        run: python3 build-aux/gen-cargo-sources.py
      - name: Commit Cargo's resolved lockfile and vendored source manifest
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock build-aux/cargo-sources.json
          if git diff --cached --quiet; then
            echo "Cargo metadata already matches the committed lock and vendor manifest"
            exit 0
          fi
          git commit -m "build(deps): resolve identity SAMPLE-AES dependencies"
          git push origin "HEAD:$HEAD_BRANCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-native-lock
          path: |
            Cargo.lock
            build-aux/cargo-sources.json
          retention-days: 3
