name: Resolve PR lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Resolve the manifest against the existing lockfile
        run: cargo metadata --format-version 1 >/dev/null
      - name: Regenerate the offline Flatpak source manifest
        run: python3 build-aux/gen-cargo-sources.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-native-lock
          path: |
            Cargo.lock
            build-aux/cargo-sources.json
          retention-days: 3
