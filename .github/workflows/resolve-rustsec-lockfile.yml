name: Resolve RustSec lockfile updates (temporary)

on:
  push:
    branches:
      - tmp/update-rustsec-lockfile

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Update the two patched crates
        run: |
          cargo update -p cookie --precise 0.18.3
          cargo update -p url --precise 2.5.9
          git diff --check
          git diff -- Cargo.lock

      - name: Commit generated lockfile and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/resolve-rustsec-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- Cargo.lock .github/workflows/resolve-rustsec-lockfile.yml
          git diff --cached --check
          git commit -m "fix(deps): update cookie and url security patches"
          git push origin HEAD
