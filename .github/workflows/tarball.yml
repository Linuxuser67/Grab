name: Prebuilt tarball

# Official prebuilt archives for third-party repackagers (e.g. FlatPark,
# which wraps the vendor's own bytes and never builds from source).
# Publishing a GitHub release (or manually dispatching with a tag) builds
# the install tree from that tag inside the GNOME SDK — the same libc the
# Flatpak runtime ships — and attaches Grab-<ver>-linux-<arch>.tar.gz back
# to the release, one per architecture (x86_64, aarch64). A .flatpak bundle
# is deliberately NOT used here: it is not an accepted vendor payload.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build the tarball for"
        required: true

jobs:
  tarball:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            tarball_arch: x86_64
          - runs-on: ubuntu-24.04-arm
            tarball_arch: aarch64
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # A release tag must carry metadata matching its version, and HEAD
      # must be that tag: otherwise the artifacts below are built from a
      # commit that disagrees with the published version/notes.
      - name: Check release metadata consistency
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: ./build-aux/check-release-consistency.py --tag "$TAG"

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak

      - name: Install GNOME SDK and Rust
        run: |
          RUNTIME=$(python3 -c "import json; print(json.load(open('build-aux/io.github.houssemko.Grab.json'))['runtime-version'])")
          echo "RUNTIME=$RUNTIME" >> "$GITHUB_ENV"
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # The rust-stable extension follows freedesktop-sdk branches
          # (YY.08), not GNOME branches: GNOME 50 -> 25.08, GNOME 51 ->
          # 26.08. A stale pin installs fine but never mounts inside the
          # SDK, so cargo goes missing. Keep in sync with runtime-version.
          flatpak install --user -y flathub "org.gnome.Sdk//$RUNTIME" "org.freedesktop.Sdk.Extension.rust-stable//26.08"

      # Same SDK layer cache as the Flatpak builds (immutable per
      # runtime version), plus the cargo registry: `cargo vendor`
      # below re-downloads every crate on each pristine run.
      - name: Cache SDK and cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/flatpak
            ~/.cache/flatpak
            .cargo-home/registry
          key: tarball-deps-${{ runner.os }}-${{ matrix.tarball_arch }}-${{ hashFiles('build-aux/io.github.houssemko.Grab.json', 'Cargo.lock') }}
          restore-keys: |
            tarball-deps-${{ runner.os }}-${{ matrix.tarball_arch }}-

      # Same offline-vendor trick as the Flatpak build, done by hand:
      # cargo vendor + a local source replacement, then meson install
      # into a staging dir. Everything runs inside the SDK sandbox.
      - name: Build install tree in the SDK
        run: |
          flatpak run --command=bash --filesystem="$PWD" --share=network \
            --env=FLATPAK_ENABLE_SDK_EXT=rust-stable "org.gnome.Sdk//$RUNTIME" -c "
            set -eu
            cd \"$PWD\"
            export PATH=\"/usr/lib/sdk/rust-stable/bin:\$PATH\"
            export CARGO_HOME=\"$PWD/.cargo-home\" CARGO_TARGET_DIR=\"$PWD/build-target\"
            cargo vendor vendor
            mkdir -p .cargo
            printf '[source.crates-io]\nreplace-with = \"vendored-sources\"\n[source.vendored-sources]\ndirectory = \"vendor\"\n' > .cargo/config.toml
            meson setup build --prefix=/usr --buildtype=release
            meson compile -C build
            DESTDIR=\"$PWD/staging\" meson install -C build
            # gnome.post_install skips DESTDIR staging, so compile here: without
            # gschemas.compiled the binary aborts on startup outside Flatpak.
            glib-compile-schemas \"$PWD/staging/usr/share/glib-2.0/schemas\"
            "

      - name: Pack and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          TARBALL_ARCH: ${{ matrix.tarball_arch }}
        run: |
          VER="${TAG#v}"
          TARBALL="Grab-$VER-linux-$TARBALL_ARCH.tar.gz"
          tar -czf "$TARBALL" -C staging usr
          tar tzf "$TARBALL" | head -8
          ls -lh "$TARBALL"
          test -f "staging/usr/bin/grab"
          gh release upload "$TAG" "$TARBALL" --clobber
