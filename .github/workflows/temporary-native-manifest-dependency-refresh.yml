name: Temporary native manifest dependency refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/native-manifest-download-20261030'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Resolve new dependencies within the declared Rust MSRV
        run: |
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo metadata --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 >/dev/null
      - name: Regenerate and validate the offline Flatpak source manifest
        run: |
          python3 build-aux/gen-cargo-sources.py
          git diff --check
      - name: Commit refreshed dependency files
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock build-aux/cargo-sources.json
          if git diff --cached --quiet; then
            echo "Cargo dependency metadata is already current."
            exit 0
          fi
          git commit -m "chore(manifest): resolve native manifest dependencies"
          git push origin "HEAD:${BRANCH}"
