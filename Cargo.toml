[package]
name = "grab"
version = "6.5.0-beta.17"
edition = "2024"
rust-version = "1.98"
description = "A GNOME download manager (GTK 4 / libadwaita, reqwest backend)"
license = "GPL-3.0-only"

[dependencies]
# Encode the per-run guarded-proxy credential for HTTP Proxy-Authorization.
base64 = "0.23.1"
# Version features must match the system libs (GTK 4.22+ / Adw 1.9+, GNOME 51 runtime).
gtk4 = { version = "0.11", features = ["v4_10", "v4_12", "v4_14", "v4_16", "v4_18", "v4_20", "v4_22"] }
libadwaita = { version = "0.9", features = ["v1_4", "v1_5", "v1_6", "v1_7", "v1_8", "v1_9"] }
# Direct deps for backend API replacements (format_size, uri_unescape_string,
# File::measure_disk_usage, File::move_/copy); versions match the transitive
# pins pulled in by gtk4/libadwaita.
glib = "0.22"
gio = "0.22"
url = "2"
# HLS playlist parsing and local media-playlist serialization.
m3u8-rs = "6.0.1"
# Typed LL-HLS media-playlist model. Keep this exact pin until a deliberate
# parser upgrade has reviewed the new untrusted-input behavior against fixtures.
broadcast-hls = "=0.4.0"
# SAMPLE-AES preflight reassembles PES/Raw packets with the API also used by iori-ssa.
# Post-decryption transport-stream validation uses the separate mpeg-ts parser.
mpeg2ts = "=0.3.1"
# Parse and validate MPEG-2 transport packets in native HLS segments.
mpeg-ts = { version = "=0.6.2", default-features = false, features = ["std"] }
# Parse ISO BMFF box trees for structural validation of native fMP4 resources.
mp4box = { version = "=0.14.0", default-features = false }
# Keep this exact pin: the ADTS safety guard is audited against iori-ssa 0.2.1 parser behavior.
iori-ssa = "=0.2.1"
# Parse HLS diagnostics without exposing playlist contents. m3u8-rs exposes nom 7 parser errors.
nom = "7"
# DASH MPD parsing and serialization for native VOD downloads; pin the untrusted-input parser release.
dash-mpd-core = "=0.1.0"
# Read Representation-level DASH Role elements omitted by the typed MPD model.
quick-xml = "0.42"
# Read the single verified Deno executable from the official release ZIP.
zip = { version = "9.1.3", default-features = false, features = ["deflate", "deflate-flate2-zlib-rs"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parse byte Content-Range response headers consistently across HTTP download paths.
http-content-range = "=0.2.5"
# HTTP-date parser for the keep-server-date option (Last-Modified header).
httpdate = "1"
# Local HTTP server for browser extension integration (replaces native messaging).
axum = { version = "0.8", features = ["json"] }
# Configure HTTP/1 header-read deadlines for the loopback extension server.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["service", "tokio"] }
tower = { version = "0.5", features = ["util"] }
# SHA-256 for verifying downloaded tool binaries against upstream release digests.
sha2 = "0.11"
# HMAC-SHA256 for the browser-extension pairing handshake (extension_server).
hmac = "0.13"
tokio = { version = "~1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "fs", "io-util", "macros", "net", "process"] }
futures-util = "0.3.34"
getrandom = "=0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "socks", "cookies", "gzip", "brotli", "deflate"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# Torrent engine (magnet links). No default features: default-tls would pull
# native-tls/OpenSSL; rust-tls keeps the rustls-only posture. reqwest 0.13
# unifies with Grab's own dependency (same major, no duplicate stack).
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
gettext-rs = "0.8"
# Video-page extraction (YouTube etc). Use the crate's tiered Moka + Redb
# metadata cache; Grab scopes entries to the full extraction identity.
yt-dlp = { version = "2.10.0", default-features = false, features = ["rustls", "cache-memory", "cache-redb"] }
libc = "0.2"
# Mozilla Public Suffix List for validating browser cookie domains.
psl = "=2.1.241"
# Safe wrappers for Linux no-replace renameat2 operations.
rustix = { version = "1.1.6", features = ["fs"] }
thiserror = "2"
# Secure destination-local temporary file for atomic no-clobber publication.
tempfile = "3.27.0"

[dev-dependencies]
pretty_assertions = "1"
proptest = "1"
# Enable ignored-MPD-element diagnostics only in test builds.
dash-mpd-core = { version = "=0.1.0", features = ["warn_ignored_elements"] }

# Keep the default unwind strategy: SAMPLE-AES contains iori-ssa panics with catch_unwind.
# Switching to panic = "abort" would make malformed segments process-fatal.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
disallowed_methods = "deny"
